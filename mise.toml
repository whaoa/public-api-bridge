[tools]
go = "1.27.1"
"go:github.com/swaggo/swag/cmd/swag" = "1.16.6"

[tasks."gen:swagger"]
description = "Generate Swagger documentation"
run = "swag init --output swagger --parseInternal"

[tasks.deps]
description = "Install Go dependencies"
run = "go mod download"

[tasks.build]
description = "Build the application"
depends = ["gen:swagger"]
run = "go build -o dist/server ."

[tasks.serve]
description = "Build and run the application"
depends = ["build"]
run = "./dist/server"
