      - description: Subject ID
        in: path
        name: id
        required: true
        type: string
      - description: Result offset
        in: query
        name: offset
        type: integer
      - description: Result count
        in: query
        name: count
        type: integer
      responses:
        "200":
          description: OK
          schema:
