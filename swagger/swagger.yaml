info:
  contact:
    name: API Support
    url: https://github.com/whaoa/public-api-bridge/issues
  description: API bridge service for accessing public APIs (Twitter, Douban, TMDB,
    etc.)
  termsOfService: https://github.com/whaoa/public-api-bridge
  title: Public API Bridge
  version: "1.0"
paths:
  /douban/{type}/subjects:
    get:
      parameters:
      - description: Subject type
        enum:
        - movie
        - tv
        in: path
        name: type
        required: true
        type: string
      - description: Search keyword
        in: query
        name: keyword
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/douban.Subject'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ReasonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ReasonError'
      summary: Search Douban subjects
      tags:
      - Douban
  /douban/{type}/subjects/{id}:
    get:
      parameters:
      - description: Subject type
        enum:
        - movie
        - tv
        in: path
        name: type
        required: true
        type: string
      - description: Subject ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/douban.Movie'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ReasonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ReasonError'
      summary: Get a Douban subject
      tags:
      - Douban
  /douban/{type}/subjects/{id}/casts:
