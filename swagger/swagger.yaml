  /douban/raw/{type}/videos/{id}:
    get:
      parameters:
      - description: Subject type
        enum:
        - movie
        - tv
        in: path
        name: type
        required: true
        type: string
      - description: Video ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/html
      responses:
        "307":
          description: Temporary Redirect
          headers:
            Location:
              description: Redirect target
              type: string
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ReasonError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.ReasonError'
      summary: Get video source
      tags:
